<div class="flex flex-col h-screen overflow-hidden">
  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-slate-200 dark:border-emerald-500/10 bg-background-light dark:bg-background-dark flex flex-col">
      <div class="p-6 flex items-center gap-3 border-b border-slate-200 dark:border-emerald-500/5">
        <img src="assets/images/logo.png" alt="Flash Logo" class="h-14 object-contain scale-[1.2] origin-left drop-shadow-[0_0_15px_rgba(16,185,129,0.4)]" />
        <div class="flex-1 min-w-0">
          <h1 class="font-neon text-xl font-bold tracking-wider text-emerald-600 dark:text-emerald-400">STAFF</h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-tighter font-bold">
            Employee Panel
          </p>
        </div>
        <!-- Theme toggle -->
        <button
          type="button"
          (click)="themeService.toggleTheme()"
          class="shrink-0 size-8 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/10 transition-all"
          [title]="themeService.theme() === 'dark' ? 'Chuyển sang sáng' : 'Chuyển sang tối'"
        >
          <span class="material-symbols-outlined text-lg">
            {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
          </span>
        </button>
      </div>
      <nav class="flex-1 px-4 space-y-2 mt-6 overflow-y-auto">
        <a
          routerLink="/employee/orders"
          routerLinkActive="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-l-4 border-emerald-500"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 dark:text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all cursor-pointer"
        >
          <span class="material-symbols-outlined">orders</span>
          <span class="text-sm font-medium">Đơn hàng</span>
        </a>
        <a
          routerLink="/employee/products"
          routerLinkActive="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-l-4 border-emerald-500"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 dark:text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all cursor-pointer"
        >
          <span class="material-symbols-outlined">inventory_2</span>
          <span class="text-sm font-medium">Tra cứu sản phẩm</span>
        </a>
        <a
          routerLink="/employee/reviews"
          routerLinkActive="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-l-4 border-emerald-500"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 dark:text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all cursor-pointer"
        >
          <span class="material-symbols-outlined">reviews</span>
          <span class="text-sm font-medium">Phản hồi đánh giá</span>
        </a>
        <a
          routerLink="/employee/customers"
          routerLinkActive="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-l-4 border-emerald-500"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 dark:text-slate-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all cursor-pointer"
        >
          <span class="material-symbols-outlined">group</span>
          <span class="text-sm font-medium">Tra cứu khách hàng</span>
        </a>
      </nav>

      <!-- Bottom section -->
      <div class="p-4 border-t border-slate-200 dark:border-emerald-500/5">
        <div class="flex items-center gap-3 px-3 py-2">
          <div class="size-8 bg-emerald-100 dark:bg-emerald-500/20 rounded-full flex items-center justify-center">
            <span class="material-symbols-outlined text-emerald-600 dark:text-emerald-400 text-sm">person</span>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-700 dark:text-slate-300">Nhân viên</p>
            <p class="text-[10px] text-slate-500 dark:text-slate-500">Staff Role</p>
          </div>
          <button
            (click)="logout()"
            class="ml-auto size-8 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-500 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-400/10 transition-all cursor-pointer"
            title="Đăng xuất"
          >
            <span class="material-symbols-outlined text-sm">logout</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main
      class="flex-1 overflow-y-auto bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 selection:bg-emerald-500/30"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
