<div class="container mx-auto px-4 py-8">
  <div class="flex items-center mb-6">
    <a routerLink="/admin/inventory-receipts" class="text-gray-500 hover:text-blue-600 mr-4 transition-colors">
      <i class="fas fa-arrow-left text-xl"></i>
    </a>
    <h1 class="text-2xl font-bold text-gray-800">Tạo Phiếu Nhập Kho Mới</h1>
  </div>

  <form [formGroup]="receiptForm" (ngSubmit)="saveReceipt()" class="space-y-6">
    <!-- Header Info -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100">Thông tin chung</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nhà cung cấp <span class="text-red-500">*</span></label>
          <select formControlName="supplierId" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="" disabled>-- Chọn Nhà cung cấp --</option>
            <option *ngFor="let s of suppliers()" [value]="s.supplierId">{{ s.name }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
          <input type="text" formControlName="notes" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Lý do nhập, ghi chú thêm...">
        </div>
      </div>
    </div>

    <!-- Items -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
        <h2 class="text-lg font-bold text-gray-800">Sản phẩm nhập</h2>
        <button type="button" (click)="addItem()" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 font-medium transition-colors text-sm flex items-center">
          <i class="fas fa-plus mr-1"></i> Thêm dòng
        </button>
      </div>

      <div formArrayName="items" class="space-y-4">
        <div *ngIf="items.length === 0" class="text-center py-8 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300">
          Chưa có sản phẩm nào. Bấm "Thêm dòng" để chọn sản phẩm.
        </div>

        <div *ngFor="let item of items.controls; let i=index" [formGroupName]="i" class="flex items-start gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200 relative">
          <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Sản phẩm <span class="text-red-500">*</span></label>
              <select formControlName="productId" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="" disabled>-- Chọn sản phẩm --</option>
                <option *ngFor="let p of products()" [value]="p.productId">{{ p.name }} ({{ p.sku }})</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Số lượng <span class="text-red-500">*</span></label>
              <input type="number" formControlName="quantity" min="1" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-500 mb-1">Đơn giá nhập <span class="text-red-500">*</span></label>
              <input type="number" formControlName="unitPrice" min="0" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
          <button type="button" (click)="removeItem(i)" class="mt-6 text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded transition-colors" title="Xóa">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </div>

      <div class="mt-6 flex justify-end">
        <div class="text-right">
          <span class="text-gray-500 font-medium mr-4">Tổng tiền dự kiến:</span>
          <span class="text-2xl font-bold text-red-600">{{ getTotalAmount() | number }} đ</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end space-x-4">
      <a routerLink="/admin/inventory-receipts" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">
        Hủy
      </a>
      <button type="submit" [disabled]="receiptForm.invalid || items.length === 0 || isSaving()" 
              class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors disabled:opacity-50 flex items-center shadow-sm">
        <i *ngIf="isSaving()" class="fas fa-spinner fa-spin mr-2"></i>
        Lưu Phiếu Nháp
      </button>
    </div>
  </form>
</div>
